<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#e6eefa">
    <meta name="description" content="Log in to zachs-quiz and keep your curiosity going.">
    <title>Log in — zachs-quiz</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/auth.css">
    <script src="/auth.js" defer></script>
  </head>
  <body class="auth-page">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="auth-header shell">
      <a class="brand" href="/" aria-label="zachs-quiz home">
        <span class="brand-mark" aria-hidden="true">z</span>
        <span>zachs-quiz</span>
      </a>
      <a class="auth-home-link" href="/">Back to home <span aria-hidden="true">↗</span></a>
    </header>

    <main class="auth-main shell" id="main">
      <section class="auth-frame" aria-labelledby="auth-title">
        <aside class="auth-aside">
          <p class="eyebrow eyebrow--light"><span aria-hidden="true">✳</span> YOUR NEXT BRAIN BREAK</p>
          <h1>Good to<br>have you<br><span>back.</span></h1>
          <p>Pick up where curiosity left off. Your next “wait, really?” moment is just around the corner.</p>
          <span class="auth-aside-mark" aria-hidden="true">?</span>
        </aside>

        <div class="auth-panel">
          <div class="auth-panel-heading">
            <p class="eyebrow">WELCOME BACK</p>
            <h2 id="auth-title">Log in</h2>
            <p>Enter your username and password to continue.</p>
          </div>

          <p class="auth-notice" id="auth-notice" role="status" aria-live="polite" hidden></p>

          <form class="auth-form" data-auth-action="login" novalidate>
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button class="button button--primary auth-submit" type="submit">
              <span>Log in</span><span aria-hidden="true">↗</span>
            </button>
            <p class="auth-message" id="auth-message" role="status" aria-live="polite"></p>
          </form>

          <p class="auth-switch">New around here? <a href="/signup.html">Create an account</a></p>
        </div>
      </section>
    </main>
  </body>
</html>
